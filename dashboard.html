<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vaïana's Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--gold:#C9A96E;--green:#1A3028;--green-d:#0F2018;--cream:#FAF6EE}
  body{font-family:'DM Sans',sans-serif;background:var(--green-d);color:var(--cream);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{background:var(–green);padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid rgba(201,169,110,0.3)}
.logo{font-family:‘Playfair Display’,serif;font-size:28px;color:var(–gold);font-style:italic}
.logo span{color:var(–cream);font-style:normal}
.clock{font-size:42px;font-weight:300;color:var(–gold);letter-spacing:4px;font-variant-numeric:tabular-nums}
.date-display{font-size:13px;color:rgba(250,246,238,0.5);letter-spacing:2px;text-transform:uppercase;text-align:right}

/* CURRENT SESSION */
.current-session{background:linear-gradient(135deg,var(–green),#2E5040);margin:24px 40px;padding:40px;border:1px solid rgba(201,169,110,0.3);position:relative;overflow:hidden}
.current-session::before{content:‘EN COURS’;position:absolute;top:20px;right:20px;background:var(–gold);color:var(–green-d);font-size:10px;letter-spacing:3px;font-weight:700;padding:6px 14px}
.session-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(–gold);margin-bottom:12px}
.session-child{font-family:‘Playfair Display’,serif;font-size:clamp(48px,8vw,96px);font-weight:700;color:var(–cream);line-height:1;margin-bottom:8px}
.session-soin{font-size:clamp(18px,3vw,28px);color:rgba(250,246,238,0.7);margin-bottom:20px;font-style:italic}
.session-meta{display:flex;gap:40px;flex-wrap:wrap}
.meta-item{display:flex;flex-direction:column;gap:4px}
.meta-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(201,169,110,0.6)}
.meta-value{font-size:20px;color:var(–gold);font-weight:600}

/* QUEUE */
.queue-section{padding:0 40px 24px;flex:1}
.queue-title{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:rgba(250,246,238,0.4);margin-bottom:16px}
.queue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.queue-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);padding:20px 24px;display:flex;align-items:center;gap:20px;transition:.3s}
.queue-card:hover{background:rgba(255,255,255,0.07);border-color:rgba(201,169,110,0.3)}
.queue-num{font-family:‘Playfair Display’,serif;font-size:36px;color:rgba(201,169,110,0.3);font-weight:700;width:50px;flex-shrink:0}
.queue-info{}
.queue-name{font-size:20px;font-weight:600;color:var(–cream);margin-bottom:4px}
.queue-soin{font-size:13px;color:rgba(250,246,238,0.5)}
.queue-coiff{font-size:11px;color:var(–gold);margin-top:4px;letter-spacing:1px}

/* FOOTER */
footer{background:var(–green);padding:14px 40px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(201,169,110,0.15)}
.foot-brand{font-family:‘Playfair Display’,serif;font-size:16px;color:var(–gold);font-style:italic}
.foot-info{font-size:12px;color:rgba(250,246,238,0.4);letter-spacing:1px}

/* FORM PANEL */
.panel{position:fixed;top:0;right:-480px;width:480px;height:100vh;background:var(–green);border-left:2px solid rgba(201,169,110,0.3);padding:32px;overflow-y:auto;transition:.4s;z-index:100}
.panel.open{right:0}
.panel h2{font-family:‘Playfair Display’,serif;font-size:24px;color:var(–gold);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(250,246,238,0.5);margin-bottom:8px}
.field input,.field select{width:100%;padding:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(201,169,110,0.2);color:var(–cream);font-size:16px;font-family:‘DM Sans’,sans-serif;outline:none}
.field input:focus,.field select:focus{border-color:var(–gold)}
.field select option{background:var(–green-d)}
.btn-save{width:100%;padding:16px;background:var(–gold);color:var(–green-d);font-size:13px;letter-spacing:3px;text-transform:uppercase;border:none;cursor:pointer;font-weight:700;font-family:‘DM Sans’,sans-serif;margin-top:8px}
.btn-add-queue{width:100%;padding:14px;background:transparent;color:var(–gold);font-size:12px;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(201,169,110,0.4);cursor:pointer;font-family:‘DM Sans’,sans-serif;margin-top:8px}
.toggle-btn{position:fixed;bottom:30px;right:30px;background:var(–gold);color:var(–green-d);width:60px;height:60px;border-radius:50%;border:none;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.3);z-index:101;font-weight:700}

@media(max-width:768px){
header{padding:16px 20px}.clock{font-size:28px}
.current-session{margin:16px 20px;padding:24px}
.session-child{font-size:48px}
.queue-section{padding:0 20px 20px}
.panel{width:100%}
footer{padding:12px 20px}
}
</style>

</head>
<body>

<header>
  <div>
    <div class="logo">Vaïana's <span>Garden</span></div>
    <div style="font-size:11px;letter-spacing:2px;color:rgba(250,246,238,0.4);text-transform:uppercase;margin-top:4px">Zone Technique</div>
  </div>
  <div style="text-align:right">
    <div class="clock" id="clock">00:00:00</div>
    <div class="date-display" id="dateDisplay"></div>
  </div>
</header>

<!-- SESSION EN COURS -->

<div class="current-session" id="currentSession">
  <div class="session-label">Séance en cours</div>
  <div class="session-child" id="currentChild">—</div>
  <div class="session-soin" id="currentSoin">Aucune séance active</div>
  <div class="session-meta">
    <div class="meta-item">
      <span class="meta-label">Coiffeuse</span>
      <span class="meta-value" id="currentCoiff">—</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Type de cheveux</span>
      <span class="meta-value" id="currentType">—</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Début séance</span>
      <span class="meta-value" id="currentTime">—</span>
    </div>
  </div>
</div>

<!-- FILE D'ATTENTE -->

<div class="queue-section">
  <div class="queue-title">File d'attente</div>
  <div class="queue-grid" id="queueGrid">
    <div style="color:rgba(250,246,238,0.3);font-size:14px;font-style:italic;padding:20px 0">Aucune cliente en attente</div>
  </div>
</div>

<footer>
  <div class="foot-brand">Vaïana's Garden™ · Nouvel Espoir Afro™</div>
  <div class="foot-info">Dashboard Technique · Usage interne</div>
</footer>

<!-- PANEL -->

<div class="panel" id="panel">
  <h2>Nouvelle séance</h2>
  <div class="field"><label>Prénom de l'enfant</label><input type="text" id="childName" placeholder="Ex: Ama"/></div>
  <div class="field"><label>Type de soin</label>
    <select id="soinType">
      <option value="">— Choisir —</option>
      <option>Diagnostic capillaire</option>
      <option>Soin hydratation complète</option>
      <option>Coiffure protectrice simple</option>
      <option>Coiffure protectrice élaborée</option>
      <option>Détressage & soin</option>
      <option>Package Garden</option>
      <option>Package Premium</option>
    </select>
  </div>
  <div class="field"><label>Type de cheveux</label>
    <select id="hairType">
      <option value="">— Choisir —</option>
      <option>Type 3A – Boucles légères</option>
      <option>Type 3B – Boucles définies</option>
      <option>Type 3C – Boucles serrées</option>
      <option>Type 4A – Coils doux</option>
      <option>Type 4B – Coils anguleux</option>
      <option>Type 4C – Coils très serrés</option>
    </select>
  </div>
  <div class="field"><label>Coiffeuse assignée</label><input type="text" id="coiffName" placeholder="Ex: Mariam"/></div>
  <button class="btn-save" onclick="startSession()">✦ Démarrer la séance</button>
  <button class="btn-add-queue" onclick="addToQueue()">+ Ajouter à la file d'attente</button>
  <div style="margin-top:24px;padding-top:24px;border-top:1px solid rgba(201,169,110,0.2)">
    <h2 style="font-size:18px;margin-bottom:16px">Terminer la séance</h2>
    <button onclick="endSession()" style="width:100%;padding:14px;background:rgba(255,100,100,0.15);border:1px solid rgba(255,100,100,0.3);color:rgba(255,150,150,0.8);font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:8px">✕ Terminer & passer à la suivante</button>
    <button onclick="clearAll()" style="width:100%;padding:12px;background:transparent;border:1px solid rgba(255,100,100,0.2);color:rgba(255,100,100,0.5);font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'DM Sans',sans-serif">🗑 Vider tout</button>
  </div>
</div>

<button class="toggle-btn" onclick="togglePanel()" title="Gérer les séances">⚙</button>

<script>
// ── HORLOGE ──
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
updateClock(); setInterval(updateClock, 1000);

// ── PANEL ──
function togglePanel(){ document.getElementById('panel').classList.toggle('open'); }

// ── ÉTAT (avec sauvegarde localStorage) ──
let queue = JSON.parse(localStorage.getItem('vg_queue') || '[]');
let currentSession = JSON.parse(localStorage.getItem('vg_session') || 'null');

function save(){
  localStorage.setItem('vg_queue', JSON.stringify(queue));
  localStorage.setItem('vg_session', JSON.stringify(currentSession));
}

// ── DÉMARRER SÉANCE ──
function startSession(){
  const child = document.getElementById('childName').value.trim();
  const soin = document.getElementById('soinType').value;
  const hair = document.getElementById('hairType').value;
  const coiff = document.getElementById('coiffName').value.trim();
  if(!child || !soin){ alert('Veuillez remplir le prénom et le type de soin.'); return; }
  currentSession = {
    child, soin, hair, coiff,
    time: new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
  };
  save();
  renderSession();
  document.getElementById('panel').classList.remove('open');
  clearForm();
}

// ── AJOUTER FILE D'ATTENTE ──
function addToQueue(){
  const child = document.getElementById('childName').value.trim();
  const soin = document.getElementById('soinType').value;
  const hair = document.getElementById('hairType').value;
  const coiff = document.getElementById('coiffName').value.trim();
  if(!child || !soin){ alert('Veuillez remplir le prénom et le type de soin.'); return; }
  queue.push({ child, soin, hair, coiff });
  save();
  renderQueue();
  clearForm();
}

// ── TERMINER SÉANCE ──
function endSession(){
  if(queue.length > 0){
    const next = queue.shift();
    currentSession = { ...next, time: new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) };
    save();
    renderSession();
    renderQueue();
  } else {
    currentSession = null;
    save();
    document.getElementById('currentChild').textContent = '—';
    document.getElementById('currentSoin').textContent = 'Aucune séance active';
    document.getElementById('currentCoiff').textContent = '—';
    document.getElementById('currentType').textContent = '—';
    document.getElementById('currentTime').textContent = '—';
  }
}

// ── AFFICHER SESSION ──
function renderSession(){
  if(!currentSession) return;
  document.getElementById('currentChild').textContent = currentSession.child;
  document.getElementById('currentSoin').textContent = currentSession.soin;
  document.getElementById('currentCoiff').textContent = currentSession.coiff || '—';
  document.getElementById('currentType').textContent = currentSession.hair || '—';
  document.getElementById('currentTime').textContent = currentSession.time;
}

// ── AFFICHER FILE D'ATTENTE ──
function renderQueue(){
  const grid = document.getElementById('queueGrid');
  if(queue.length === 0){
    grid.innerHTML = '<div style="color:rgba(250,246,238,0.3);font-size:14px;font-style:italic;padding:20px 0">Aucune cliente en attente</div>';
    return;
  }
  grid.innerHTML = queue.map((item, i) => `
    <div class="queue-card">
      <div class="queue-num">${String(i+1).padStart(2,'0')}</div>
      <div class="queue-info">
        <div class="queue-name">${item.child}</div>
        <div class="queue-soin">${item.soin}</div>
        ${item.coiff ? `<div class="queue-coiff">✦ ${item.coiff}</div>` : ''}
      </div>
      <button onclick="removeFromQueue(${i})" style="margin-left:auto;background:rgba(255,100,100,0.15);border:1px solid rgba(255,100,100,0.2);color:rgba(255,150,150,0.7);padding:6px 12px;cursor:pointer;font-size:12px;border-radius:4px">✕</button>
    </div>
  `).join('');
}

// ── SUPPRIMER DE LA FILE ──
function removeFromQueue(i){
  queue.splice(i, 1);
  save();
  renderQueue();
}

// ── VIDER TOUT ──
function clearAll(){
  if(confirm('Vider toute la file d'attente ?')){
    queue = [];
    currentSession = null;
    save();
    renderQueue();
    document.getElementById('currentChild').textContent = '—';
    document.getElementById('currentSoin').textContent = 'Aucune séance active';
    document.getElementById('currentCoiff').textContent = '—';
    document.getElementById('currentType').textContent = '—';
    document.getElementById('currentTime').textContent = '—';
  }
}

function clearForm(){
  document.getElementById('childName').value = '';
  document.getElementById('soinType').value = '';
  document.getElementById('hairType').value = '';
  document.getElementById('coiffName').value = '';
}

// ── CHARGER AU DÉMARRAGE ──
renderSession();
renderQueue();
</script>

</body>
</html>
